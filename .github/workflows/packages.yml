name: Orphanage — build + publish paquets

on:
  workflow_dispatch:          # lancement manuel depuis Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Installer jq reprepro
        run: sudo apt-get update && sudo apt-get install -y jq reprepro

      - name: Build des paquets (10-89)
        run: |
          set -e
          for script in src/*.sh; do
            [ -e "$script" ] || continue
            basename="${script##*/}"
            prefix="${basename%%[!0-9]*}"
            if [[ "$prefix" =~ ^[0-9]+$ ]] && [ "$prefix" -ge 10 ] && [ "$prefix" -le 89 ]; then
              echo "== $script =="
              if ! bash "$script"; then
                echo "!! echec dans $script" >&2
              fi
            fi
          done

      - name: Générer le repo github (91)
        # Résilient : sans la clé GPG, reprepro échoue à signer (SignWith: yes).
        # L'étape échoue mais le deploy de docs/ a lieu quand même.
        # Plus tard : ajouter le secret GPG_PRIVATE_KEY → 91 signe → tout fonctionne.
        run: bash src/91-update-repo-github.sh
        continue-on-error: true

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
